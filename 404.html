<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#fff3a0;--violet:#c8a8ff;--forge:#ffcfcc;--black:#0b0b0d}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:radial-gradient(ellipse at 50% 40%,#1a0f29 0%,var(--black) 70%);color:#fdfdfd;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem;line-height:1.6}
h1{font-size:clamp(4rem,18vw,9rem);font-weight:100;letter-spacing:.15em;color:var(--gold);text-shadow:0 0 80px rgba(255,243,160,.3);line-height:1}
p{margin-top:1rem;color:var(--violet);letter-spacing:.08em;opacity:.85;max-width:34ch}
.links{margin-top:2.5rem;display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
a{color:var(--violet);text-decoration:none;border:1px solid var(--violet);border-radius:2rem;padding:.7rem 1.8rem;font-size:.85rem;letter-spacing:.08em;transition:background .3s,color .3s}
a:hover,a:focus-visible{background:var(--violet);color:var(--black)}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
