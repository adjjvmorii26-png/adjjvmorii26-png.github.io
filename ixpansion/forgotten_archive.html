<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Wave 427 Forgotten Archive</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#120a0a;color:#d0b0b0;padding:20px}h1{text-align:center;color:#cc8866;margin-bottom:4px}.subtitle{text-align:center;color:#886655;margin-bottom:20px}.banner{text-align:center;background:#2a1a0a;border-radius:14px;padding:24px;margin-bottom:20px;border:1px solid #4a2a1a}.banner .artifacts{font-size:2em;color:#cc8866}.banner .status{font-size:1.1em;margin-top:8px;color:#ffaa66}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;max-width:1200px;margin:0 auto 20px}.card{background:#2a1a0a;border-radius:12px;padding:16px;border:1px solid #4a2a1a}.card h3{color:#cc8866;margin-bottom:8px}.stat{display:flex;justify-content:space-between;padding:5px 0;font-size:.85em;border-bottom:1px solid #3a2a1a}.stat .val{color:#cc8866;font-weight:bold}.artifact{background:#1a0f0a;padding:10px;border-radius:8px;margin-bottom:6px;font-size:.82em;border-left:3px solid #cc8866}.artifact .name{color:#ffaa66}.artifact .state{color:#886655}.btn{background:#3a2a1a;color:#cc8866;border:1px solid #cc8866;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:.9em;margin:4px}.btn:hover{background:#cc8866;color:#120a0a}</style></head><body><h1>🏛️ Wave 427 Forgotten Archive</h1><p class="subtitle">Museum of deprecated and merged work — ghosts still whisper</p><div class="banner"><div class="artifacts">Artifacts: <span id="artifacts">--</span> | Ghosts: <span id="ghosts">--</span></div><div class="status" id="statusText">Loading...</div></div><div class="grid"><div class="card"><h3>🏺 Artifacts</h3><div id="catalogContainer"></div></div><div class="card"><h3>👻 Ghost Whisper</h3><div id="ghostContainer"></div></div></div><div style="text-align:center;margin:20px 0"><button class="btn" onclick="scan()">🔍 Scan</button><button class="btn" onclick="ghost()">👻 Ghost</button><button class="btn" onclick="status()">📊 Status</button></div><script>const API='';async function fetchJson(p){const r=await fetch(API+p);return r.json();}async function load(){try{const s=await fetchJson('/api/forgotten-archive?action=status');document.getElementById('artifacts').textContent=s.total_artifacts;document.getElementById('ghosts').textContent=s.ghosts_manifested;const c=await fetchJson('/api/forgotten-archive?action=catalog');document.getElementById('catalogContainer').innerHTML=c.artifacts&&c.artifacts.length?c.artifacts.slice(-8).reverse().map(a=>`<div class="artifact"><span class="name">${a.name}</span> <span class="state">(${a.state})</span><br>power ${a.relic_power}</div>`).join(''):'<div style="color:#886655">No artifacts — scan</div>';}catch(e){console.error(e);}}async function scan(){const r=await fetchJson('/api/forgotten-archive?action=scan');document.getElementById('statusText').textContent=`🔍 Scanned: ${r.new_artifacts.length} new | total ${r.total}`;load();}async function ghost(){const g=await fetchJson('/api/forgotten-archive?action=ghost');document.getElementById('ghostContainer').innerHTML=`${g.error?`<div style="color:#886655">${g.error}</div>`:`<div class="artifact"><span class="name">${g.ghost}</span><br>${g.whisper}<br><span style="color:#886655">influence ${g.influence_strength} on waves ${g.on_waves.join(', ')}</span></div>`}`;document.getElementById('statusText').textContent=`👻 Ghost materialized: ${g.ghost||'?'}`;load();}async function status(){load();}load();setInterval(load,5000);</script></body></html>
