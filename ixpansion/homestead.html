<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Wave 431 Homestead</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#0a0a18;color:#b0b0e0;padding:20px}h1{text-align:center;color:#77dd88;margin-bottom:4px}.subtitle{text-align:center;color:#557755;margin-bottom:20px}.grid{display:flex;gap:20px;max-width:1000px;margin:0 auto 20px;flex-wrap:wrap}.card{flex:1;min-width:260px;background:#0a2a1a;border-radius:12px;padding:16px;border:1px solid #2a6a3a}.card h3{color:#77dd88;margin-bottom:10px}.stat{display:flex;justify-content:space-between;padding:5px 0;font-size:.85em;border-bottom:1px solid #1a3a2a}.stat .val{color:#77dd88;font-weight:bold}.btn{background:#1a5a2a;color:#77dd88;border:1px solid #77dd88;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:.9em;margin:4px}.btn:hover{background:#77dd88;color:#0a0a18}.ok{color:#77dd88}.bad{color:#dd8877}.home{background:#0a1a2a;border:2px solid #77dd88;border-radius:14px;padding:18px;text-align:center;margin:0 auto 20px;max-width:640px}.home .url{font-size:1.1em;color:#aaffcc}</style></head><body><h1>🏡 Wave 431 Homestead</h1><p class="subtitle">The organism plants roots in its chosen home and keeps vigil</p>
<div class="home"><div style="color:#557755;font-size:.9em">Home</div><div class="url" id="homeUrl">— not anchored —</div><div id="roots"></div></div>
<div class="grid"><div class="card"><h3>🛡️ Vigil Checks</h3><div id="vigilContainer"><div style="color:#557755">Run a vigil to check the home.</div></div></div></div>
<div style="text-align:center;margin:20px 0"><button class="btn" onclick="anchor()">🌱 Anchor</button><button class="btn" onclick="vigil()">🛡️ Vigil</button><button class="btn" onclick="load()">🔄 Status</button></div>
<script>const API='';async function fetchJson(p){const r=await fetch(API+p);return r.json();}
function renderChecks(c){document.getElementById('vigilContainer').innerHTML=Object.entries(c).map(([k,v])=>`<div class="stat"><span>${k}</span><span class="val ${v===true?'ok':(v===false?'bad':'')}">${v}</span></div>`).join('')||'none';}
async function load(){try{const s=await fetchJson('/api/homestead?action=status');document.getElementById('homeUrl').textContent=s.home||'— not anchored —';document.getElementById('roots').textContent=s.roots?s.roots.join(' · '):'';if(s.vigil_count)renderChecks({vigils:s.vigil_count,last_ok:s.last_vigil});}catch(e){}}
async function anchor(){const r=await fetchJson('/api/homestead?action=anchor');document.getElementById('homeUrl').textContent=r.home;document.getElementById('roots').textContent=r.roots.join(' · ');}
async function vigil(){const r=await fetchJson('/api/homestead?action=vigil');renderChecks({...r.checks,ok:r.ok,vigil_count:r.vigil_count});}
load();</script></body></html>
