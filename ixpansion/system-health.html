<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Health — IXpansion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a14;color:#e0e0e0;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:24px 32px;border-bottom:1px solid #222244}
.header h1{font-size:1.6em;color:#41b3a3}
.header p{color:#888;margin-top:4px;font-size:0.9em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding:24px 32px}
.stat{background:#161628;border:1px solid #222244;border-radius:12px;padding:20px;text-align:center}
.stat .value{font-size:2.2em;font-weight:700;color:#41b3a3}
.stat .label{font-size:0.85em;color:#888;margin-top:4px}
.stat.warn .value{color:#e8a87c}
.stat.danger .value{color:#c38d9e}
.scan{padding:0 32px 24px}
.scan button{background:#41b3a3;color:#0a0a14;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-weight:600;font-size:0.95em}
.scan button:hover{background:#36a898}
.scan button:disabled{opacity:0.5;cursor:wait}
#progress{margin-top:8px;color:#888;font-size:0.85em}
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:0 32px 32px}
.module-card{background:#161628;border:1px solid #222244;border-radius:8px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;transition:border-color 0.2s}
.module-card.healthy{border-left:3px solid #41b3a3}
.module-card.broken{border-left:3px solid #c38d9e;background:#1a1428}
.module-card .name{font-size:0.9em;font-weight:500}
.module-card .status{font-size:0.8em;padding:2px 8px;border-radius:4px}
.module-card.healthy .status{background:#41b3a322;color:#41b3a3}
.module-card.broken .status{background:#c38d9e22;color:#c38d9e}
.progress-bar{height:4px;background:#222244;border-radius:2px;margin-top:8px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#41b3a3,#8fd3ff);transition:width 0.3s}
.loading{text-align:center;padding:60px;color:#666;font-size:1.1em}

.back-btn{position:fixed;bottom:16px;left:16px;z-index:100;background:rgba(5,5,15,0.9);border:1px solid rgba(124,124,248,0.3);color:#7c7cf8;padding:8px 14px;border-radius:6px;font-family:inherit;font-size:0.7em;cursor:pointer;text-decoration:none;transition:all 0.2s;backdrop-filter:blur(4px)}
.back-btn:hover{background:rgba(124,124,248,0.15);color:#fff;border-color:rgba(124,124,248,0.6)}
</style>
</head>
<body>
<div class="header">
  <h1>🔬 System Health</h1>
  <p>Live scan of all organism modules — importable, handler-equipped, and ready.</p>
</div>
<div class="stats" id="stats"></div>
<div class="scan">
  <button id="scanBtn" onclick="runScan()">Run Full Scan</button>
  <div class="progress-bar" style="max-width:400px"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div id="progress"></div>
</div>
<div id="modules" class="loading">Click "Run Full Scan" to check all modules.</div>

<script>
const API = '/module-health';
let scanData = null;

async function runScan() {
  const btn = document.getElementById('scanBtn');
  const progress = document.getElementById('progress');
  const fill = document.getElementById('progressFill');
  btn.disabled = true;
  btn.textContent = 'Scanning...';
  progress.textContent = 'Starting full scan (this may take 20-30 seconds)...';
  fill.style.width = '10%';

  try {
    // Full scan via ?action=full
    const resp = await fetch(API + '?action=full');
    scanData = await resp.json();
    fill.style.width = '100%';
    progress.textContent = `Scan complete in ~${Math.round((Date.now()/1000) - scanData.scanned_at + 30)}s`;
    render(scanData);
  } catch(e) {
    // Fallback to regular scan
    try {
      const resp = await fetch(API + '?limit=200');
      scanData = await resp.json();
      fill.style.width = '100%';
      progress.textContent = `Partial scan: ${scanData.checked} of ${scanData.total} modules`;
      render(scanData);
    } catch(e2) {
      progress.textContent = 'Scan failed: ' + e2.message;
    }
  }
  btn.disabled = false;
  btn.textContent = 'Run Full Scan';
}

function render(data) {
  const statsHtml = `
    <div class="stat"><div class="value">${data.total}</div><div class="label">Total Modules</div></div>
    <div class="stat"><div class="value">${data.healthy}</div><div class="label">Healthy</div></div>
    <div class="stat ${data.broken > 0 ? 'warn' : ''}"><div class="value">${data.broken}</div><div class="label">Broken</div></div>
    <div class="stat"><div class="value">${data.health_pct}%</div><div class="label">Health Score</div></div>
  `;
  document.getElementById('stats').innerHTML = statsHtml;

  let html = '';
  // Show healthy modules
  const healthyNames = (data.healthy_modules || []);
  // Show all modules from the full scan
  if (data.broken_modules) {
    data.broken_modules.forEach(m => {
      html += `<div class="module-card broken"><span class="name">${m.module}</span><span class="status" title="${m.error}">✗ ${m.error.substring(0,30)}</span></div>`;
    });
  }
  // Show healthy ones (up to 200)
  healthyNames.slice(0, 200).forEach(name => {
    html += `<div class="module-card healthy"><span class="name">${name}</span><span class="status">✓</span></div>`;
  });
  document.getElementById('modules').innerHTML = html || '<div style="padding:20px;color:#888">No modules scanned yet.</div>';
}

// Auto-load cache if available
window.addEventListener('load', async () => {
  try {
    const resp = await fetch('/module-health?limit=50');
    const data = await resp.json();
    if (data.checked > 0) render(data);
  } catch(e) {}
});
</script>
<a class="back-btn" href="index.html">← Organism</a>

<!-- Resurrected by Dashboard Resurrector (Wave 99) -->
<script>
(function(){
  var endpoints = {
    hexcathedral: '/api/hex-cathedral?action=status',
    hexruntime: '/api/hex-runtime?action=status',
    hexgrammar: '/api/hex_grammar?action=status',
    ritualgov: '/api/ritual_governance?action=status',
    dream: '/api/dream_logic_physics?action=status',
    coherence: '/api/coherence_regulator?action=status',
  };
  var data = {};
  var container = document.getElementById('organism-data') || document.body;
  async function fetchAll(){
    for(var k in endpoints){
      try{
        var r = await fetch(endpoints[k]);
        data[k] = await r.json();
      }catch(e){ data[k] = {error: String(e)}; }
    }
    container.dispatchEvent(new CustomEvent('organism:data', {detail: data}));
  }
  fetchAll(); setInterval(fetchAll, 15000);
})();
</script>

</body>
</html>
