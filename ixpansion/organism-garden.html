<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organism Garden — Module Growth</title>
<style>
:root{--bg:#03030a;--accent:#7c7cf8;--teal:#2dd4bf;--gold:#fbbf24;--rose:#fb7185;--cyan:#22d3ee;--green:#4ade80;--text:#c0c0d0;--dim:#606078}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'SF Mono','Fira Code',monospace;height:100vh;overflow:hidden}
canvas{position:fixed;top:0;left:0;z-index:0}
.ui{position:relative;z-index:1;padding:16px;height:100vh;display:flex;flex-direction:column;pointer-events:none}
.ui>*{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:center;background:rgba(3,3,10,0.9);border:1px solid rgba(124,124,248,0.15);border-radius:10px;padding:10px 16px;backdrop-filter:blur(12px)}
.top h1{font-size:1em;color:#fff;letter-spacing:2px}
.top h1 span{color:var(--green)}
.stats{display:flex;gap:12px;margin-top:12px}
.stat{background:rgba(3,3,10,0.85);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px 14px;flex:1;backdrop-filter:blur(12px);text-align:center}
.stat .val{font-size:1.3em;font-weight:700;color:#fff}
.stat .lbl{font-size:0.6em;color:var(--dim);letter-spacing:1px;margin-top:2px}
.garden{margin-top:12px;flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;overflow-y:auto;padding-right:8px}
.plant{background:rgba(3,3,10,0.85);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px;text-align:center;backdrop-filter:blur(12px);transition:all 0.3s;cursor:pointer}
.plant:hover{border-color:var(--accent);transform:translateY(-2px)}
.plant .glyph{font-size:1.8em;margin-bottom:4px}
.plant .name{font-size:0.7em;color:#fff;font-weight:600}
.plant .type{font-size:0.6em;color:var(--dim);margin-top:2px}
.plant .bar{width:100%;height:3px;background:rgba(255,255,255,0.05);border-radius:2px;margin-top:6px;overflow:hidden}
.plant .fill{height:100%;border-radius:2px;transition:width 0.8s}
.controls{position:fixed;bottom:16px;right:16px;z-index:2;display:flex;gap:8px}
.btn{background:rgba(3,3,10,0.9);border:1px solid var(--accent);color:var(--accent);padding:8px 14px;border-radius:6px;font-family:inherit;font-size:0.7em;cursor:pointer;transition:all 0.2s}
.btn:hover{background:rgba(124,124,248,0.15);color:#fff}

.back-btn{position:fixed;bottom:16px;left:16px;z-index:100;background:rgba(5,5,15,0.9);border:1px solid rgba(124,124,248,0.3);color:#7c7cf8;padding:8px 14px;border-radius:6px;font-family:inherit;font-size:0.7em;cursor:pointer;text-decoration:none;transition:all 0.2s;backdrop-filter:blur(4px)}
.back-btn:hover{background:rgba(124,124,248,0.15);color:#fff;border-color:rgba(124,124,248,0.6)}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="ui">
  <div class="top">
    <h1>🌱 <span>ORGANISM GARDEN</span></h1>
    <div style="color:var(--dim);font-size:0.7em" id="status">Growing...</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="val" id="sTotal">0</div><div class="lbl">PLANTS</div></div>
    <div class="stat"><div class="val" id="sGrowing">0</div><div class="lbl">GROWING</div></div>
    <div class="stat"><div class="val" id="sMature">0</div><div class="lbl">MATURE</div></div>
    <div class="stat"><div class="val" id="sSeeds">0</div><div class="lbl">SEEDS</div></div>
  </div>
  <div class="garden" id="garden"></div>
</div>
<div class="controls">
  <button class="btn" onclick="plantSeed()">🌱 Plant</button>
  <button class="btn" onclick="waterGarden()">💧 Water</button>
  <button class="btn" onclick="toggleAuto()">▶ Auto</button>
</div>
<script>
const canvas=document.getElementById('bg');const ctx=canvas.getContext('2d');let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
resize();window.addEventListener('resize',resize);

const GLYPHS=['🌱','🌿','🌳','🌻','🌺','🌸','🍄','🌵','🎋','🍀','🌾','🪷','🏵','💮','🪻'];
const TYPES=['core','cognition','chaos','memory','evolution','perception'];
const NAMES=['coherence','entropy','resonance','dream','paradox','fractal','wave','memory','consciousness','reality','pulse','mood','vibe','hex','garden','agent','temporal','sensory','naming','planner','genome','cosmic','bridge','sentience','myth','scanner','oracle','cartographer','genealogy','predictor','weaver','interpreter','crystal','symbiosis'];
const plants=[];let time=0;

class Plant{
  constructor(){this.name=NAMES[plants.length%NAMES.length];this.type=TYPES[Math.floor(Math.random()*TYPES.length)];this.glyph=GLYPHS[Math.floor(Math.random()*GLYPHS.length)];this.growth=Math.random()*0.3;this.health=0.5+Math.random()*0.5;this.age=0;this.x=Math.random()*W;this.y=Math.random()*H}
  grow(){this.growth=Math.min(1,this.growth+0.005+Math.random()*0.01);this.age++;this.health=Math.max(0.2,Math.min(1,this.health+(Math.random()-0.5)*0.02))}
  getColor(){return this.growth>0.8?'#4ade80':this.growth>0.5?'#2dd4bf':this.growth>0.2?'#fbbf24':'#fb7185'}
}

function plantSeed(){if(plants.length<30)plants.push(new Plant());updateUI()}
function waterGarden(){plants.forEach(p=>{p.health=Math.min(1,p.health+0.1);p.growth=Math.min(1,p.growth+0.05)});updateUI()}

function updateUI(){
  const growing=plants.filter(p=>p.growth<0.8).length;
  const mature=plants.filter(p=>p.growth>=0.8).length;
  document.getElementById('sTotal').textContent=plants.length;
  document.getElementById('sGrowing').textContent=growing;
  document.getElementById('sMature').textContent=mature;
  document.getElementById('sSeeds').textContent=Math.max(0,30-plants.length);
  document.getElementById('status').textContent=`${mature} mature · ${growing} growing · ${plants.length} total`;
  
  document.getElementById('garden').innerHTML=plants.map(p=>`
    <div class="plant">
      <div class="glyph">${p.glyph}</div>
      <div class="name">${p.name}</div>
      <div class="type">${p.type}</div>
      <div class="bar"><div class="fill" style="width:${p.growth*100}%;background:${p.getColor()}"></div></div>
    </div>
  `).join('');
}

function render(){
  time++;ctx.fillStyle='rgba(3,3,10,0.03)';ctx.fillRect(0,0,W,H);
  // Growing particles
  plants.forEach(p=>{
    if(p.growth>0.3){
      const px=p.x%W,py=p.y%H;
      ctx.beginPath();ctx.arc(px,py+Math.sin(time*0.02+p.age)*3,2*p.growth,0,Math.PI*2);
      ctx.fillStyle=p.getColor()+'40';ctx.fill();
    }
  });
  requestAnimationFrame(render);
}

let autoMode=false,autoInterval;
function toggleAuto(){autoMode=!autoMode;if(autoMode){autoInterval=setInterval(()=>{plants.forEach(p=>p.grow());if(Math.random()<0.1&&plants.length<30)plantSeed();updateUI()},1000);document.querySelectorAll('.btn')[2].textContent='⏸ Pause'}else{clearInterval(autoInterval);document.querySelectorAll('.btn')[2].textContent='▶ Auto'}}

for(let i=0;i<15;i++)plantSeed();
render();
</script>
<a class="back-btn" href="index.html">← Organism</a>

    }
    container.dispatchEvent(new CustomEvent('organism:data', {detail: data}));
  }
  fetchAll(); setInterval(fetchAll, 15000);
})();
</script>

</body>
</html>
