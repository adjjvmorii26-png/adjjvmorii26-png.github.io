<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Wave 426 Causal Weave</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#0a0f12;color:#a0d0d0;padding:20px}h1{text-align:center;color:#66dddd;margin-bottom:4px}.subtitle{text-align:center;color:#558888;margin-bottom:20px}.banner{text-align:center;background:#0a2a2a;border-radius:14px;padding:24px;margin-bottom:20px;border:1px solid #1a4a4a}.banner .threads{font-size:2em;color:#66dddd}.banner .status{font-size:1.1em;margin-top:8px;color:#ffaa66}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;max-width:1200px;margin:0 auto 20px}.card{background:#0a2a2a;border-radius:12px;padding:16px;border:1px solid #1a4a4a}.card h3{color:#66dddd;margin-bottom:8px}.stat{display:flex;justify-content:space-between;padding:5px 0;font-size:.85em;border-bottom:1px solid #1a3a3a}.stat .val{color:#66dddd;font-weight:bold}.thread{background:#0a1f1f;padding:10px;border-radius:8px;margin-bottom:6px;font-size:.82em;border-left:3px solid #66dddd}.thread .future{color:#ffaa66}.thread .past{color:#66dddd}.thread .arrow{color:#558888}.btn{background:#1a4a4a;color:#66dddd;border:1px solid #66dddd;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:.9em;margin:4px}.btn:hover{background:#66dddd;color:#0a0f12}</style></head><body><h1>🕸️ Wave 426 Causal Weaving</h1><p class="subtitle">Future events reach backward to reshape the organism's past</p><div class="banner"><div class="threads">Threads: <span id="threads">--</span> | Resolved: <span id="resolved">--</span></div><div class="status" id="statusText">Loading...</div></div><div class="grid"><div class="card"><h3>🕸️ Woven Threads</h3><div id="threadsContainer"></div></div><div class="card"><h3>🧬 Last Rewrite</h3><div id="rewriteContainer"></div></div><div class="card"><h3>💥 Resolve</h3><div id="resolveContainer"></div></div></div><div style="text-align:center;margin:20px 0"><button class="btn" onclick="weave()">🕸️ Weave</button><button class="btn" onclick="resolve()">💥 Resolve</button><button class="btn" onclick="status()">📊 Status</button></div><script>const API='';async function fetchJson(p){const r=await fetch(API+p);return r.json();}async function load(){try{const s=await fetchJson('/api/causal-weave?action=status');document.getElementById('threads').textContent=s.total_threads;document.getElementById('resolved').textContent=s.resolved;if(s.last_rewrite){document.getElementById('statusText').textContent=`🕸️ ${s.last_rewrite.anchor} ← reshaped`;}const reg=await fetchJson('/api/causal-weave?action=registry');document.getElementById('threadsContainer').innerHTML=reg.threads?reg.threads.slice(-8).reverse().map(t=>`<div class="thread"><span class="future">${t.future_event}</span> <span class="arrow">←</span> <span class="past">${t.past_anchor}</span><br><span style="color:#558888">strength ${t.causal_strength} | ripple ${t.ripple_radius}</span></div>`).join(''):'<div style="color:#558888">No threads yet</div>';}catch(e){console.error(e);}}async function weave(){const t=await fetchJson('/api/causal-weave?action=weave');document.getElementById('statusText').textContent=`🕸️ Woven: ${t.future_event} ← ${t.past_anchor}`;load();}async function resolve(){const r=await fetchJson('/api/causal-weave?action=resolve');document.getElementById('resolveContainer').innerHTML=`<div class="stat"><span>Resolved</span><span class="val">✅</span></div><div class="stat"><span>Future</span><span class="val">${r.future_event}</span></div><div class="stat"><span>Past</span><span class="val">${r.past_anchor}</span></div><div class="stat"><span>Paradox Cost</span><span class="val">${r.paradox_cost}</span></div>`;document.getElementById('statusText').textContent=`🧬 Resolved: ${r.future_event} now shapes ${r.past_anchor}`;load();}async function status(){load();}load();setInterval(load,5000);</script></body></html>
