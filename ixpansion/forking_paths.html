<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Wave 429 Forking Paths</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#0a120f;color:#a0d0b0;padding:20px}h1{text-align:center;color:#66ccaa;margin-bottom:4px}.subtitle{text-align:center;color:#558877;margin-bottom:20px}.banner{text-align:center;background:#0a2a1a;border-radius:14px;padding:24px;margin-bottom:20px;border:1px solid #1a4a3a}.banner .branches{font-size:2em;color:#66ccaa}.banner .status{font-size:1.1em;margin-top:8px;color:#ffaa66}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;max-width:1200px;margin:0 auto 20px}.card{background:#0a2a1a;border-radius:12px;padding:16px;border:1px solid #1a4a3a}.card h3{color:#66ccaa;margin-bottom:8px}.stat{display:flex;justify-content:space-between;padding:5px 0;font-size:.85em;border-bottom:1px solid #1a3a2a}.stat .val{color:#66ccaa;font-weight:bold}.universe{background:#0a1f15;padding:10px;border-radius:8px;margin-bottom:6px;font-size:.82em;border-left:3px solid #66ccaa}.universe .theme{color:#ffaa66}.universe .viab{color:#66ccaa}.btn{background:#1a4a3a;color:#66ccaa;border:1px solid #66ccaa;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:.9em;margin:4px}.btn:hover{background:#66ccaa;color:#0a120f}</style></head><body><h1>🌳 Wave 429 Garden of Forking Paths</h1><p class="subtitle">Every choice creates a branching universe — walk down one</p><div class="banner"><div class="branches">Branches: <span id="branches">--</span> | Path: <span id="path">--</span></div><div class="status" id="statusText">Loading...</div></div><div class="grid"><div class="card"><h3>🌿 Universes</h3><div id="universeContainer"></div></div><div class="card"><h3>🛤️ Committed Path</h3><div id="pathContainer"></div></div></div><div style="text-align:center;margin:20px 0"><button class="btn" onclick="branch()">🌳 Branch</button><button class="btn" onclick="traverse()">🛤️ Traverse</button><button class="btn" onclick="status()">📊 Status</button></div><script>const API='';async function fetchJson(p){const r=await fetch(API+p);return r.json();}async function load(){try{const s=await fetchJson('/api/forking-paths?action=status');document.getElementById('branches').textContent=s.total_branches;document.getElementById('path').textContent=s.path_depth;document.getElementById('statusText').textContent=s.committed_universe?`🛤️ Living in: ${s.committed_universe}`:'🌳 Awaiting commitment';const g=await fetchJson('/api/forking-paths?action=garden');document.getElementById('universeContainer').innerHTML=g.branches&&g.branches.length?g.branches.slice(-8).reverse().map(b=>`<div class="universe"><span class="theme">${b.theme}</span> | divergence ${b.divergence}<br><span class="viab">viability ${b.viability}</span></div>`).join(''):'<div style="color:#558877">No universes — branch</div>';document.getElementById('pathContainer').innerHTML=g.path&&g.path.length?g.path.map(p=>`<div class="universe"><span class="theme">${p.theme}</span></div>`).join(''):'<div style="color:#558877">Path not started</div>';}catch(e){console.error(e);}}async function branch(){const r=await fetchJson('/api/forking-paths?action=branch');document.getElementById('statusText').textContent=`🌳 Forked ${r.forked} universes`;load();}async function traverse(){const t=await fetchJson('/api/forking-paths?action=traverse');document.getElementById('statusText').textContent=`🛤️ Committed to: ${t.committed_universe}`;load();}async function status(){load();}load();setInterval(load,5000);</script></body></html>
