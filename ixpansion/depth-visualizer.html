<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depth Visualizer · IXpansion</title>
<style>
  :root {
    --bg: #0b0b12;
    --fg: #c8c8d8;
    --accent: #4cff7a;
    --accent2: #8fd3ff;
    --muted: #555570;
    --surface: #161622;
    --border: #2a2a3a;
    --depth: #4cff7a;
    --resonance: #c8a8ff;
    --heartbeat: #ff3a00;
    --anomaly: #ff9a5c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Courier New', monospace;
    background: var(--bg);
    color: var(--fg);
    padding: 24px;
    min-height: 100vh;
  }
  .identity { text-align: center; margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  .identity h1 { color: var(--accent); font-size: 1.6em; letter-spacing: 0.1em; }
  .identity .subtitle { color: var(--muted); font-size: 0.85em; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; margin-bottom: 32px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .card h2 { color: var(--accent2); font-size: 1.05em; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .depth-bar { font-family: 'Courier New', monospace; margin: 4px 0; }
  .bar-fill { color: var(--depth); }
  .bar-empty { color: var(--muted); }
  .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .stat-label { color: var(--muted); }
  .stat-value { color: var(--accent); font-weight: bold; }
  .heartbeat-line { color: var(--heartbeat); font-size: 0.95em; line-height: 1.6; white-space: pre; }
  .chain-item { padding: 4px 0; font-size: 0.9em; }
  .chain-connector { color: var(--muted); }
  .chain-module { color: var(--resonance); }
  .anomaly-item { padding: 8px 12px; margin: 4px 0; background: var(--bg); border-radius: 4px; border-left: 3px solid var(--anomaly); }
  .anomaly-type { color: var(--anomaly); font-weight: bold; }
  .category-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .category-name { color: var(--muted); width: 100px; font-size: 0.85em; }
  .category-bar { flex: 1; }
  .badge { background: var(--surface); padding: 2px 8px; border-radius: 4px; font-size: 0.8em; color: var(--accent2); }

.back-btn{position:fixed;bottom:16px;left:16px;z-index:100;background:rgba(5,5,15,0.9);border:1px solid rgba(124,124,248,0.3);color:#7c7cf8;padding:8px 14px;border-radius:6px;font-family:inherit;font-size:0.7em;cursor:pointer;text-decoration:none;transition:all 0.2s;backdrop-filter:blur(4px)}
.back-btn:hover{background:rgba(124,124,248,0.15);color:#fff;border-color:rgba(124,124,248,0.6)}
</style>
<script src="/shared.js"></script>
</head>
<body>
<div class="identity">
  <h1>DEPTH VISUALIZER</h1>
  <div class="subtitle" id="wave-info">Loading...</div>
</div>

<div class="grid">
  <div class="card" style="grid-column: 1 / -1;">
    <h2>Category Depth Map</h2>
    <div id="depthMap"></div>
    <div class="stat-row" style="margin-top:12px;">
      <span class="stat-label">Total Modules</span>
      <span class="stat-value" id="totalModules">-</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Total Connections</span>
      <span class="stat-value" id="totalConnections">-</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Average Depth</span>
      <span class="stat-value" id="avgDepth">-</span>
    </div>
  </div>

  <div class="card">
    <h2>Heartbeat</h2>
    <div class="stat-row"><span class="stat-label">Pulse Rate</span><span class="stat-value" id="pulseRate">-</span></div>
    <div class="stat-row"><span class="stat-label">Coherence</span><span class="stat-value" id="coherence">-</span></div>
    <div class="stat-row"><span class="stat-label">Vitality</span><span class="stat-value" id="vitality">-</span></div>
    <div class="stat-row"><span class="stat-label">Status</span><span class="stat-value" id="hbStatus">-</span></div>
    <div class="heartbeat-line" id="heartbeatVis">-</div>
  </div>

  <div class="card">
    <h2>Resonance Chain</h2>
    <div id="chainVis"></div>
    <div class="stat-row" style="margin-top:12px;">
      <span class="stat-label">Total Depth</span>
      <span class="stat-value" id="chainDepth">-</span>
    </div>
  </div>

  <div class="card" style="grid-column: 1 / -1;">
    <h2>Depth Anomalies</h2>
    <div id="anomaliesVis"></div>
  </div>
</div>

<script>
(function() {
  var el = window.IXP;
  if (el && el.renderIdentity) el.renderIdentity(document.getElementById('wave-info'));
})();

async function fetchAll() {
  try {
    const r = await fetch('/depth-visualizer');
    const d = await r.json();

    // Depth Map
    var dm = d.depth_map || {};
    document.getElementById('totalModules').textContent = dm.total_modules || '-';
    document.getElementById('totalConnections').textContent = dm.total_connections || '-';
    document.getElementById('avgDepth').textContent = dm.avg_depth ? dm.avg_depth.toFixed(3) : '-';

    var mapEl = document.getElementById('depthMap');
    mapEl.innerHTML = '';
    var cats = dm.category_depths || {};
    for (var cat in cats) {
      var depth = cats[cat];
      var barLen = Math.round(depth * 30);
      var bar = '<span class="bar-fill">' + '\u2588'.repeat(barLen) + '</span>' + '<span class="bar-empty">' + '\u2591'.repeat(30 - barLen) + '</span>';
      mapEl.innerHTML += '<div class="category-row"><span class="category-name">' + cat + '</span><span class="category-bar">' + bar + ' ' + depth.toFixed(3) + '</span></div>';
    }

    // Heartbeat
    var hb = d.heartbeat || {};
    document.getElementById('pulseRate').textContent = hb.pulse_rate || '-';
    document.getElementById('coherence').textContent = hb.coherence ? hb.coherence.toFixed(3) : '-';
    document.getElementById('vitality').textContent = hb.vitality ? hb.vitality.toFixed(3) : '-';
    document.getElementById('hbStatus').textContent = hb.status || '-';
    document.getElementById('heartbeatVis').textContent = hb.visual_beat || '-';

    // Chain
    var chain = d.chain || {};
    var chainEl = document.getElementById('chainVis');
    chainEl.innerHTML = '';
    (chain.chain || []).forEach(function(c) {
      var div = document.createElement('div');
      div.className = 'chain-item';
      div.innerHTML = '<span class="chain-connector">' + c.connector + '</span> <span class="chain-module">' + c.module + '</span> ' + c.bar;
      chainEl.appendChild(div);
    });
    document.getElementById('chainDepth').textContent = chain.total_depth ? chain.total_depth.toFixed(3) : '-';

    // Anomalies
    var anomEl = document.getElementById('anomaliesVis');
    anomEl.innerHTML = '';
    (d.anomalies || []).forEach(function(a) {
      var div = document.createElement('div');
      div.className = 'anomaly-item';
      div.innerHTML = '<span class="anomaly-type">' + a.glyph + ' ' + a.type + '</span> - ' + a.module + ' (severity: ' + a.severity.toFixed(2) + ')<br><small style="color:var(--muted)">' + a.description + '</small>';
      anomEl.appendChild(div);
    });
  } catch(e) {
    document.getElementById('depthMap').textContent = 'Error: ' + e.message;
  }
}

fetchAll();
setInterval(fetchAll, 15000);
</script>
<a class="back-btn" href="index.html">← Organism</a>

<!-- Resurrected by Dashboard Resurrector (Wave 99) -->
<script>
(function(){
  var endpoints = {
    hexcathedral: '/api/hex-cathedral?action=status',
    hexruntime: '/api/hex-runtime?action=status',
    hexgrammar: '/api/hex_grammar?action=status',
    ritualgov: '/api/ritual_governance?action=status',
    dream: '/api/dream_logic_physics?action=status',
    coherence: '/api/coherence_regulator?action=status',
  };
  var data = {};
  var container = document.getElementById('organism-data') || document.body;
  async function fetchAll(){
    for(var k in endpoints){
      try{
        var r = await fetch(endpoints[k]);
        data[k] = await r.json();
      }catch(e){ data[k] = {error: String(e)}; }
    }
    container.dispatchEvent(new CustomEvent('organism:data', {detail: data}));
  }
  fetchAll(); setInterval(fetchAll, 15000);
})();
</script>

</body>
</html>
