<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Wave 428 Resonance Chamber</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#0a0a18;color:#b0b0e0;padding:20px}h1{text-align:center;color:#8888ff;margin-bottom:4px}.subtitle{text-align:center;color:#6666aa;margin-bottom:20px}.banner{text-align:center;background:#0a0a3a;border-radius:14px;padding:24px;margin-bottom:20px;border:1px solid #2a2a6a}.banner .freq{font-size:2em;color:#8888ff}.banner .status{font-size:1.1em;margin-top:8px;color:#66ffaa}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;max-width:1200px;margin:0 auto 20px}.card{background:#0a0a3a;border-radius:12px;padding:16px;border:1px solid #2a2a6a}.card h3{color:#8888ff;margin-bottom:8px}.stat{display:flex;justify-content:space-between;padding:5px 0;font-size:.85em;border-bottom:1px solid #1a1a4a}.stat .val{color:#8888ff;font-weight:bold}.btn{background:#1a1a5a;color:#8888ff;border:1px solid #8888ff;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:.9em;margin:4px}.btn:hover{background:#8888ff;color:#0a0a18}</style></head><body><h1>🎵 Wave 428 Resonance Chamber</h1><p class="subtitle">Internal states vibrate — coherence peaks trigger real-world pulses</p><div class="banner"><div class="freq">Frequency: <span id="freq">--</span> Hz</div><div class="status" id="statusText">Loading...</div></div><div class="grid"><div class="card"><h3>🎼 Resonance</h3><div id="resContainer"></div></div><div class="card"><h3>🔔 Pulses</h3><div id="pulseContainer"></div></div></div><div style="text-align:center;margin:20px 0"><button class="btn" onclick="tune()">🎵 Tune</button><button class="btn" onclick="resonate()">🎼 Resonate</button><button class="btn" onclick="emit()">🔔 Emit</button></div><script>const API='';async function fetchJson(p){const r=await fetch(API+p);return r.json();}async function load(){try{const s=await fetchJson('/api/resonance-chamber?action=status');if(s.tuned){document.getElementById('freq').textContent=s.frequency;document.getElementById('statusText').textContent=`Harmonic ${s.harmonic}Hz | pulses ${s.total_pulses}`;}else{document.getElementById('statusText').textContent='Not tuned — click Tune';}}catch(e){}}async function tune(){const t=await fetchJson('/api/resonance-chamber?action=tune');document.getElementById('freq').textContent=t.frequency;document.getElementById('statusText').textContent=`🔊 Tuned to ${t.frequency}Hz (harmonic ${t.harmonic}Hz)`;}async function resonate(){const r=await fetchJson('/api/resonance-chamber?action=resonate');document.getElementById('resContainer').innerHTML=`<div class="stat"><span>Frequency</span><span class="val">${r.frequency}Hz</span></div><div class="stat"><span>Coherence</span><span class="val">${r.coherence}</span></div><div class="stat"><span>Amplitude</span><span class="val">${r.amplitude}</span></div><div class="stat"><span>Body</span><span class="val">${r.body_state}</span></div>${r.standing_wave?'<div style="color:#66ffaa;margin-top:8px">🌊 STANDING WAVE — threshold reached</div>':''}`;}async function emit(){const e=await fetchJson('/api/resonance-chamber?action=emit');document.getElementById('pulseContainer').innerHTML=e.emitted?`<div class="stat"><span>Pulse</span><span class="val">✅ ${e.pulse.event_type}</span></div><div class="stat"><span>Freq</span><span class="val">${e.pulse.frequency}</span></div>`:`<div style="color:#886655">Not emitted: ${e.reason}</div>`;document.getElementById('statusText').textContent=e.emitted?'🔔 Pulse emitted!':'🎵 Keep resonating...';}load();setInterval(load,5000);</script></body></html>
