<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Symbiosis Protocol — IXPANSION — IXPANSION</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#02020a;--accent:#7c7cf8;--teal:#2dd4bf;--text:#b8b8d0;--dim:#505068;--bright:#e8e8f8}
body{background:var(--bg);color:var(--text);font-family:'SF Mono','Fira Code',monospace;min-height:100vh}
canvas#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
@keyframes pulse{0%,100%{opacity:0.6}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px) rotate(1deg)}}
@keyframes countUp{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}
.header{position:relative;z-index:2;text-align:center;padding:60px 24px 30px}
.header .glyph{font-size:2.5em;animation:drift 4s infinite;display:inline-block;text-shadow:0 0 30px rgba(124,124,248,0.5)}
.header h1{font-size:2.5em;font-weight:200;letter-spacing:12px;color:var(--bright);margin:12px 0}
.header h1 span{color:var(--accent)}
.header .tagline{color:var(--dim);font-size:0.7em;letter-spacing:4px}
.metrics{position:relative;z-index:2;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;padding:20px 40px;max-width:1200px;margin:0 auto}
.metric{background:#06061a;border:1px solid rgba(124,124,248,0.15);border-radius:12px;padding:24px;text-align:center;animation:fadeIn 0.6s}
.metric .value{font-size:2em;font-weight:700;color:var(--accent);animation:countUp 1s}
.metric .label{font-size:0.7em;color:var(--dim);margin-top:8px;letter-spacing:2px}
.btn{background:#06061a;border:1px solid rgba(124,124,248,0.2);color:var(--accent);padding:10px 24px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:0.8em;margin:4px}
.btn:hover{background:rgba(124,124,248,0.1);box-shadow:0 0 20px rgba(124,124,248,0.2)}
.canvas-area{position:relative;z-index:2;width:100%;height:500px;margin:20px 40px}
.canvas-area canvas{width:100%;height:100%;border-radius:12px;border:1px solid rgba(124,124,248,0.1)}
.status-bar{position:relative;z-index:2;text-align:center;padding:20px;color:var(--dim);font-size:0.7em;letter-spacing:2px;border-top:1px solid rgba(124,124,248,0.1)}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="header">
  <div class="glyph">🜂</div>
  <h1>Symbiosis_Protocol <span>WAVE 000</span></h1>
  <div class="tagline">LIVE INTERACTIVE DASHBOARD</div>
</div>
<div class="metrics">
  <div class="metric"><div class="value" id="v1">—</div><div class="label">Wave 000 Coherence</div></div>
  <div class="metric"><div class="value" id="v2">—</div><div class="label">Resonance Index</div></div>
  <div class="metric"><div class="value" id="v3">—</div><div class="label">Entropy Budget</div></div>
  <div class="metric"><div class="value" id="v4">—</div><div class="label">Module Count</div></div>
</div>
<div style="text-align:center;padding:10px"><button class="btn" onclick="refresh()">Refresh</button><button class="btn" onclick="toggleAnim()">Animate</button><button class="btn" onclick="exportState()">Export</button></div>
<div class="canvas-area"><canvas id="liveCanvas"></canvas></div>
<div class="status-bar"><span style="color:var(--green)">● LIVE</span> — Symbiosis Protocol — IXPANSION — <span id="ts">—</span></div>
<script>
const W=000,T=Symbiosis Protocol — IXPANSION;let a=false,t=0,nodes=[],edges=[];
const c=document.getElementById('liveCanvas'),x=c.getContext('2d');
function rs(){c.width=c.offsetWidth;c.height=c.offsetHeight;nodes=[];edges=[];const n=20+Math.floor(Math.random()*30);for(let i=0;i<n;i++)nodes.push({x:Math.random()*c.width,y:Math.random()*c.height,r:3+Math.random()*6,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,p:Math.random()*6.28});for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y)<150)edges.push([i,j])}
function dr(){x.clearRect(0,0,c.width,c.height);if(a)t+=0.01;x.strokeStyle='rgba(124,124,248,0.06)';x.lineWidth=0.5;for(const[i,j]of edges){const A=nodes[i],B=nodes[j];x.beginPath();x.moveTo(A.x+Math.sin(t+A.p)*5,A.y+Math.cos(t+B.p)*5);x.lineTo(B.x+Math.sin(t+A.p)*5,B.y+Math.cos(t+B.p)*5);x.stroke()}x.fillStyle='rgba(124,124,248,0.5)';for(const N of nodes){if(a){N.x+=N.vx;N.y+=N.vy;if(N.x<0||N.x>c.width)N.vx*=-1;if(N.y<0||N.y>c.height)N.vy*=-1}const g=x.createRadialGradient(N.x,N.y,0,N.x,N.y,N.r*4);g.addColorStop(0,'rgba(124,124,248,'+(0.2+0.15*Math.sin(t+N.p))+')');g.addColorStop(1,'transparent');x.fillStyle=g;x.beginPath();x.arc(N.x,N.y,N.r*4,0,6.28);x.fill();x.fillStyle='#7c7cf8';x.beginPath();x.arc(N.x,N.y,N.r,0,6.28);x.fill()}}
function loop(){dr();requestAnimationFrame(loop)}
rs();loop();
let mi=0;const vals=[()=>Math.floor(1000+Math.random()*9000),()=>(Math.random()*100).toFixed(1),()=>Math.floor(Math.random()*500),()=>((Math.random()*0.99).toFixed(3))];
function upd(){document.getElementById('v1').textContent=vals[0]();document.getElementById('v2').textContent=vals[1]();document.getElementById('v3').textContent=vals[2]();document.getElementById('v4').textContent=vals[3]();document.getElementById('ts').textContent=new Date().toISOString();setTimeout(upd,2000)}
upd();function refresh(){rs()}function toggleAnim(){a=!a}function exportState(){navigator.clipboard.writeText(JSON.stringify({wave:W,t:Date.now(),n:nodes.length,e:edges.length}))}
window.addEventListener('resize',rs);
</script>
</body>
</html>
