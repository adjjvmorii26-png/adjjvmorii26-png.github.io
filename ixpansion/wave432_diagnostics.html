<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Organism Diagnostics | IXPANSION Wave 432</title>
    <style>
        body { font-family: monospace; background: #0a0a14; color: #e0e0e0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .card { background: #12182a; border: 1px solid #1a3a4a; border-radius: 10px; padding: 15px; }
        .card h3 { color: #e8a87c; margin-bottom: 10px; }
        .metric { display: flex; justify-content: space-between; padding: 5px 0; }
        .label { color: #888; }
        .value { color: #41b3a3; font-weight: bold; }
        .status-thriving { color: #41b3a3; }
        .status-healthy { color: #7bc8a4; }
        .status-warning { color: #e8a87c; }
        .status-critical { color: #e85c5c; }
        .bar { width: 100%; height: 6px; background: #1a2a3a; border-radius: 3px; margin: 5px 0; }
        .bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #e85c5c, #e8a87c, #41b3a3); }
    </style>
</head>
<body>
    <h1>🔬 Organism Diagnostics Dashboard</h1>
    <div class="grid">
        <div class="card">
            <h3>Coherence Metrics</h3>
            <div class="metric"><span class="label">Coherence</span><span class="value" id="coherence">--</span></div>
            <div class="bar"><div class="bar-fill" id="coherence-bar" style="width:95%"></div></div>
            <div class="metric"><span class="label">Mutation Pressure</span><span class="value" id="pressure">--</span></div>
            <div class="metric"><span class="label">Vault Density</span><span class="value" id="density">--</span></div>
            <div class="metric"><span class="label">Entropy Budget</span><span class="value" id="entropy">--</span></div>
        </div>
        <div class="card">
            <h3>Module Health</h3>
            <div class="metric"><span class="label">Total Modules</span><span class="value" id="total">--</span></div>
            <div class="metric"><span class="label">Healthy</span><span class="value" id="healthy">--</span></div>
            <div class="metric"><span class="label">Critical</span><span class="value" id="critical">--</span></div>
            <div class="metric"><span class="label">Health Rate</span><span class="value" id="rate">--</span></div>
        </div>
        <div class="card">
            <h3>Vault Status</h3>
            <div class="metric"><span class="label">Total Vaults</span><span class="value" id="vaults">--</span></div>
            <div class="metric"><span class="label">Avg Resonance</span><span class="value" id="resonance">--</span></div>
            <div id="vault-list"></div>
        </div>
        <div class="card">
            <h3>Organism Status</h3>
            <div class="metric"><span class="label">Status</span><span class="value status-thriving" id="status">--</span></div>
            <div class="metric"><span class="label">Wave</span><span class="value">432</span></div>
            <div class="metric"><span class="label">Regulator</span><span class="value">Active</span></div>
            <div class="metric"><span class="label">Last Updated</span><span class="value" id="updated">--</span></div>
        </div>
    </div>
    <script>
        async function refresh() {
            try {
                const r = await fetch('/api/wave432_vault_driven_evolution?action=status');
                const d = await r.json();
                document.getElementById('coherence').textContent = (d.coherence||0).toFixed(4);
                document.getElementById('coherence-bar').style.width = Math.min(100,(d.coherence||0)*100)+'%';
                document.getElementById('pressure').textContent = (d.mutation_pressure||0).toFixed(4);
                document.getElementById('density').textContent = (d.vault_density||0).toFixed(4);
                document.getElementById('entropy').textContent = d.entropy_budget??'--';
                document.getElementById('status').textContent = d.status||'--';
                document.getElementById('status').className = 'value status-'+(d.status||'').toLowerCase();
                document.getElementById('updated').textContent = new Date(d.timestamp*1000).toLocaleTimeString();
            } catch(e) {}
            try {
                const r = await fetch('/api/wave432_vault_driven_evolution?action=diagnostics_sweep');
                const d = await r.json();
                document.getElementById('total').textContent = d.total_modules||'--';
                document.getElementById('healthy').textContent = d.healthy_modules||'--';
                document.getElementById('critical').textContent = (d.critical_modules||[]).length||'--';
                document.getElementById('rate').textContent = d.total_modules ? ((d.healthy_modules||0)/d.total_modules*100).toFixed(1)+'%' : '--';
            } catch(e) {}
        }
        setInterval(refresh, 3000);
        refresh();
    </script>
</body>
</html>
