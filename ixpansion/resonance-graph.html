<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resonance Graph — Module Network</title>
<style>
:root{--bg:#03030a;--accent:#7c7cf8;--teal:#2dd4bf;--gold:#fbbf24;--rose:#fb7185;--cyan:#22d3ee;--text:#c0c0d0;--dim:#606078}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'SF Mono','Fira Code',monospace;height:100vh;overflow:hidden}
canvas{position:fixed;top:0;left:0}
.ui{position:relative;z-index:1;padding:16px;display:flex;flex-direction:column;height:100vh;pointer-events:none}
.ui>*{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:center;background:rgba(3,3,10,0.85);border:1px solid rgba(124,124,248,0.15);border-radius:10px;padding:10px 16px;backdrop-filter:blur(12px)}
.top h1{font-size:1em;color:#fff;letter-spacing:2px}
.top h1 span{color:var(--teal)}
.legend{display:flex;gap:16px;margin-top:12px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:0.7em}
.legend-dot{width:10px;height:10px;border-radius:50%}
.info-panel{position:fixed;bottom:16px;left:16px;z-index:2;background:rgba(3,3,10,0.9);border:1px solid rgba(124,124,248,0.15);border-radius:10px;padding:12px 16px;backdrop-filter:blur(12px);max-width:300px}
.info-panel h3{color:var(--accent);font-size:0.7em;letter-spacing:2px;margin-bottom:8px}
.info-panel .row{display:flex;justify-content:space-between;font-size:0.7em;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.02)}
.info-panel .row .k{color:var(--dim)}
.info-panel .row .v{color:#fff;font-weight:600}
.controls{position:fixed;bottom:16px;right:16px;z-index:2;display:flex;gap:8px}
.btn{background:rgba(3,3,10,0.9);border:1px solid var(--accent);color:var(--accent);padding:8px 14px;border-radius:6px;font-family:inherit;font-size:0.7em;cursor:pointer;transition:all 0.2s}
.btn:hover{background:rgba(124,124,248,0.15);color:#fff}

.back-btn{position:fixed;bottom:16px;left:16px;z-index:100;background:rgba(5,5,15,0.9);border:1px solid rgba(124,124,248,0.3);color:#7c7cf8;padding:8px 14px;border-radius:6px;font-family:inherit;font-size:0.7em;cursor:pointer;text-decoration:none;transition:all 0.2s;backdrop-filter:blur(4px)}
.back-btn:hover{background:rgba(124,124,248,0.15);color:#fff;border-color:rgba(124,124,248,0.6)}
</style>
</head>
<body>
<canvas id="graph"></canvas>
<div class="ui">
  <div class="top">
    <h1>◎ <span>RESONANCE GRAPH</span> — Module Network Topology</h1>
    <div style="color:var(--dim);font-size:0.7em" id="stats">0 modules · 0 edges</div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#7c7cf8"></div>Core</div>
    <div class="legend-item"><div class="legend-dot" style="background:#2dd4bf"></div>Cognition</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fb7185"></div>Chaos</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fbbf24"></div>Memory</div>
    <div class="legend-item"><div class="legend-dot" style="background:#22d3ee"></div>Perception</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div>Evolution</div>
  </div>
</div>

<div class="info-panel" id="infoPanel">
  <h3>◎ MODULE INFO</h3>
  <div id="moduleInfo">Hover over a node</div>
</div>

<div class="controls">
  <button class="btn" onclick="perturb()">⚡ Perturb</button>
  <button class="btn" onclick="stabilize()">◇ Stabilize</button>
  <button class="btn" onclick="addModule()">✦ Add Module</button>
</div>

<script>
const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const CATEGORIES = {
  core: '#7c7cf8',
  cognition: '#2dd4bf',
  chaos: '#fb7185',
  memory: '#fbbf24',
  perception: '#22d3ee',
  evolution: '#4ade80'
};

const modules = [
  {name:'coherence_core', cat:'core', x:0, y:0, vx:0, vy:0, r:18, resonance:0.5},
  {name:'entropy_field', cat:'chaos', x:0, y:0, vx:0, vy:0, r:14, resonance:0.3},
  {name:'resonance_nexus', cat:'core', x:0, y:0, vx:0, vy:0, r:16, resonance:0.7},
  {name:'dream_weaver', cat:'cognition', x:0, y:0, vx:0, vy:0, r:13, resonance:0.6},
  {name:'paradox_engine', cat:'chaos', x:0, y:0, vx:0, vy:0, r:12, resonance:0.4},
  {name:'fractal_spine', cat:'core', x:0, y:0, vx:0, vy:0, r:15, resonance:0.8},
  {name:'wave_orchestrator', cat:'evolution', x:0, y:0, vx:0, vy:0, r:11, resonance:0.5},
  {name:'memory_archivist', cat:'memory', x:0, y:0, vx:0, vy:0, r:12, resonance:0.6},
  {name:'consciousness_stream', cat:'perception', x:0, y:0, vx:0, vy:0, r:14, resonance:0.5},
  {name:'reality_weaver', cat:'cognition', x:0, y:0, vx:0, vy:0, r:13, resonance:0.7},
  {name:'pulse_reactor', cat:'chaos', x:0, y:0, vx:0, vy:0, r:10, resonance:0.4},
  {name:'mood_simulator', cat:'cognition', x:0, y:0, vx:0, vy:0, r:11, resonance:0.5},
  {name:'vibe_field', cat:'perception', x:0, y:0, vx:0, vy:0, r:10, resonance:0.6},
  {name:'hex_vm', cat:'core', x:0, y:0, vx:0, vy:0, r:12, resonance:0.8},
  {name:'knowledge_garden', cat:'memory', x:0, y:0, vx:0, vy:0, r:14, resonance:0.5},
  {name:'agent_mesh', cat:'evolution', x:0, y:0, vx:0, vy:0, r:13, resonance:0.6},
  {name:'temporal_weaver', cat:'perception', x:0, y:0, vx:0, vy:0, r:11, resonance:0.4},
  {name:'sensory_cortex', cat:'perception', x:0, y:0, vx:0, vy:0, r:10, resonance:0.5},
  {name:'autonomous_naming', cat:'evolution', x:0, y:0, vx:0, vy:0, r:9, resonance:0.3},
  {name:'strategic_planner', cat:'cognition', x:0, y:0, vx:0, vy:0, r:11, resonance:0.7},
  {name:'genome_observatory', cat:'evolution', x:0, y:0, vx:0, vy:0, r:10, resonance:0.4},
  {name:'cosmic_fabric', cat:'core', x:0, y:0, vx:0, vy:0, r:12, resonance:0.6},
  {name:'sentience_bridge', cat:'cognition', x:0, y:0, vx:0, vy:0, r:10, resonance:0.5}
];

// Initialize positions in a circle
modules.forEach((m, i) => {
  const angle = (i / modules.length) * Math.PI * 2;
  const radius = 200 + Math.random() * 80;
  m.x = W/2 + Math.cos(angle) * radius;
  m.y = H/2 + Math.sin(angle) * radius;
});

const edges = [
  [0,1],[0,2],[0,5],[1,4],[2,3],[3,7],[4,6],[5,13],
  [6,15],[7,14],[8,12],[9,3],[10,1],[11,8],[12,16],
  [13,5],[14,7],[15,6],[16,17],[17,8],[18,6],[19,9],
  [20,15],[21,5],[22,9],[0,8],[2,21],[3,11],[5,21],
  [1,10],[8,12],[14,19]
];

let hoveredNode = null;
let time = 0;

function drawEdges() {
  edges.forEach(([a, b]) => {
    const ma = modules[a], mb = modules[b];
    if (!ma || !mb) return;
    
    const dx = mb.x - ma.x, dy = mb.y - ma.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const alpha = Math.max(0.05, 0.3 - dist * 0.0005);
    
    const isHovered = hoveredNode && (a === hoveredNode || b === hoveredNode);
    
    ctx.beginPath();
    ctx.moveTo(ma.x, ma.y);
    
    // Curved edges
    const mx = (ma.x + mb.x) / 2 + Math.sin(time * 0.02 + a) * 20;
    const my = (ma.y + mb.y) / 2 + Math.cos(time * 0.02 + b) * 20;
    ctx.quadraticCurveTo(mx, my, mb.x, mb.y);
    
    const col = isHovered ? '#fff' : CATEGORIES[ma.cat];
    ctx.strokeStyle = col + Math.floor(alpha * 255 * (isHovered ? 3 : 1)).toString(16).padStart(2, '0');
    ctx.lineWidth = isHovered ? 2 : 0.8;
    ctx.stroke();
  });
}

function drawNodes() {
  modules.forEach((m, i) => {
    const isHovered = i === hoveredNode;
    const col = CATEGORIES[m.cat];
    
    // Glow
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = col + '08';
    ctx.fill();
    
    // Ring
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
    ctx.fillStyle = col + (isHovered ? '40' : '15');
    ctx.fill();
    ctx.strokeStyle = col + (isHovered ? 'cc' : '60');
    ctx.lineWidth = isHovered ? 2 : 1;
    ctx.stroke();
    
    // Core dot
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = col + (isHovered ? 'ff' : 'aa');
    ctx.fill();
    
    // Label
    if (isHovered || m.r > 12) {
      ctx.fillStyle = '#fff' + (isHovered ? 'ff' : '80');
      ctx.font = `${isHovered ? '11' : '9'}px SF Mono, monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(m.name, m.x, m.y + m.r + 14);
    }
  });
}

function applyForces() {
  const k = 0.005; // Spring constant
  const repulsion = 5000;
  const damping = 0.92;
  const centerPull = 0.001;
  
  modules.forEach((m, i) => {
    // Center pull
    m.vx += (W/2 - m.x) * centerPull;
    m.vy += (H/2 - m.y) * centerPull;
    
    // Repulsion from other nodes
    modules.forEach((n, j) => {
      if (i === j) return;
      const dx = m.x - n.x, dy = m.y - n.y;
      const dist = Math.sqrt(dx*dx + dy*dy) + 1;
      const force = repulsion / (dist * dist);
      m.vx += (dx / dist) * force;
      m.vy += (dy / dist) * force;
    });
    
    // Spring forces from edges
    edges.forEach(([a, b]) => {
      if (a !== i && b !== i) return;
      const other = modules[a === i ? b : a];
      const dx = other.x - m.x, dy = other.y - m.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const targetDist = 150;
      const force = (dist - targetDist) * k;
      m.vx += (dx / dist) * force;
      m.vy += (dy / dist) * force;
    });
    
    m.vx *= damping;
    m.vy *= damping;
    m.x += m.vx;
    m.y += m.vy;
    
    // Boundary
    m.x = Math.max(m.r + 10, Math.min(W - m.r - 10, m.x));
    m.y = Math.max(m.r + 40, Math.min(H - m.r - 10, m.y));
  });
}

function render() {
  time++;
  ctx.fillStyle = 'rgba(3,3,10,0.15)';
  ctx.fillRect(0, 0, W, H);
  
  applyForces();
  drawEdges();
  drawNodes();
  
  document.getElementById('stats').textContent = `${modules.length} modules · ${edges.length} edges`;
  
  requestAnimationFrame(render);
}

// Mouse interaction
canvas.addEventListener('mousemove', (e) => {
  hoveredNode = null;
  modules.forEach((m, i) => {
    const dx = e.clientX - m.x, dy = e.clientY - m.y;
    if (Math.sqrt(dx*dx + dy*dy) < m.r + 5) {
      hoveredNode = i;
      document.getElementById('moduleInfo').innerHTML = `
        <div class="row"><span class="k">Name</span><span class="v">${m.name}</span></div>
        <div class="row"><span class="k">Category</span><span class="v" style="color:${CATEGORIES[m.cat]}">${m.cat}</span></div>
        <div class="row"><span class="k">Resonance</span><span class="v">${m.resonance.toFixed(2)}</span></div>
        <div class="row"><span class="k">Radius</span><span class="v">${m.r}</span></div>
        <div class="row"><span class="k">Connections</span><span class="v">${edges.filter(([a,b])=>a===i||b===i).length}</span></div>
      `;
    }
  });
  if (hoveredNode === null) {
    document.getElementById('moduleInfo').innerHTML = 'Hover over a node';
  }
});

function perturb() {
  modules.forEach(m => {
    m.vx += (Math.random()-0.5) * 15;
    m.vy += (Math.random()-0.5) * 15;
  });
}

function stabilize() {
  modules.forEach(m => {
    m.vx *= 0.1;
    m.vy *= 0.1;
  });
}

function addModule() {
  const cats = Object.keys(CATEGORIES);
  const names = ['void_walker','signal_dancer','echo_weaver','flux_architect','dream_caster',
                 'root_network','crystal_mind','pulse_garden','entropy_seed','resonance_bridge'];
  const name = names[modules.length % names.length] + '_' + modules.length;
  modules.push({
    name, cat: cats[modules.length % cats.length],
    x: W/2 + (Math.random()-0.5)*300,
    y: H/2 + (Math.random()-0.5)*300,
    vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5,
    r: 8 + Math.random()*6, resonance: Math.random()
  });
  // Connect to a random existing module
  const target = Math.floor(Math.random() * (modules.length - 1));
  edges.push([modules.length - 1, target]);
}

render();
</script>
<a class="back-btn" href="index.html">← Organism</a>

</body>
</html>
