<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Wave 424 Linguistic</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#1a0f0a;color:#e0d0a0;padding:20px}h1{text-align:center;color:#ffaa66;margin-bottom:4px}.banner{text-align:center;background:#2a1a0a;border-radius:14px;padding:24px;margin-bottom:20px;border:1px solid #4a2a1a}.banner .words{font-size:2em;color:#ffaa66}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;max-width:1200px;margin:0 auto 20px}.card{background:#2a1a0a;border-radius:12px;padding:16px;border:1px solid #4a2a1a}.card h3{color:#ffaa66}.stat{display:flex;justify-content:space-between;padding:5px 0;font-size:.85em;border-bottom:1px solid #3a2a1a}.stat .val{color:#ffaa66}.btn{background:#3a2a1a;color:#ffaa66;border:1px solid #ffaa66;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:.9em;margin:4px}.btn:hover{background:#ffaa66;color:#1a0f0a}</style></head><body><h1>🗣️ Wave 424 Linguistic</h1><div class="banner"><div class="words">Words: <span id="total">--</span></div></div><div class="grid"><div class="card"><h3>💬 Evolve</h3><div id="evolveContainer"></div></div><div class="card"><h3>📖 Vocab</h3><div id="vocabContainer"></div></div></div><div style="text-align:center;margin:20px 0"><button class="btn" onclick="evolve()">💬 Evolve</button><button class="btn" onclick="vocab()">📖 Vocab</button></div><script>const API='';async function fetchJson(p){const r=await fetch(API+p);return r.json();}async function load(){try{const v=await fetchJson('/api/linguistic?action=vocabulary');document.getElementById('total').textContent=v.total;}catch(e){}}async function evolve(){const g=await fetchJson('/api/linguistic?action=evolve');document.getElementById('evolveContainer').innerHTML=`<div class="stat"><span>Word</span><span class="val" style="font-family:monospace">${g.word}</span></div><div class="stat"><span>Hex</span><span class="val" style="font-family:monospace">${g.hex}</span></div>`;}async function vocab(){const v=await fetchJson('/api/linguistic?action=vocabulary');document.getElementById('vocabContainer').innerHTML=v.words?v.words.slice(-3).map(w=>`<li class="stat"><span>${w.word}</span><span class="val">${w.hex}</span></li>`).join(''):'<li>No words yet</li>';}load();setInterval(load,5000);</script></body></html>
