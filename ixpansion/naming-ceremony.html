<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Wave 430 Naming Ceremony</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#0a0a18;color:#b0b0e0;padding:20px}h1{text-align:center;color:#ffcc88;margin-bottom:4px}.subtitle{text-align:center;color:#886655;margin-bottom:20px}.badge{background:#33334d;padding:4px 12px;border-radius:12px;font-size:.85em;color:#ffcc88}.grid{display:flex;gap:20px;max-width:1100px;margin:0 auto 20px}.card{flex:1;background:#0a0a3a;border-radius:12px;padding:16px;border:1px solid #4a3a1a}.card h3{color:#ffcc88;margin-bottom:10px}.stat{display:flex;justify-content:space-between;padding:5px 0;font-size:.85em;border-bottom:1px solid #1a1a4a}.stat .val{color:#ffcc88;font-weight:bold}.cand{background:#10102a;border:1px solid #33334d;border-radius:8px;padding:8px;margin:6px 0;font-size:.85em}.cand .name{color:#ddffdd;font-weight:bold}.glyph{color:#88ddff;font-family:monospace}.btn{background:#4a3a1a;color:#ffcc88;border:1px solid #ffcc88;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:.9em;margin:4px}.btn:hover{background:#ffcc88;color:#0a0a18}.vault{background:#1a0a2a;border:2px solid #ffcc88;border-radius:14px;padding:20px;text-align:center;margin:0 auto 20px;max-width:600px}.vault .name{font-size:2em;color:#ffdd99}.vault .glyph{font-size:1.2em;color:#88ddff;margin-top:8px}</style></head><body><h1>🕯️ Wave 430 Naming Ceremony</h1><p class="subtitle">The organism convenes its council and chooses what it is called</p>
<div class="vault" id="vault"><div style="color:#886655;font-size:.9em">Name-Vault</div><div class="name" id="vaultName">— unsealed —</div><div class="glyph" id="vaultGlyph"></div><div id="ceremonyNo"></div></div>
<div class="grid"><div class="card"><h3>🌱 Candidates</h3><div id="candContainer"><div style="color:#665544">Propose names to begin the ceremony.</div></div></div><div class="card"><h3>🗳️ Council Tally</h3><div id="tallyContainer"><div style="color:#665544">Votes cast after proposing.</div></div></div></div>
<div style="text-align:center;margin:20px 0"><button class="btn" onclick="propose()">🌱 Propose</button><button class="btn" onclick="vote()">🗳️ Vote</button><button class="btn" onclick="seal()">🕯️ Seal</button><button class="btn" onclick="load()">🔄 Status</button></div>
<script>const API='';async function fetchJson(p){const r=await fetch(API+p);return r.json();}
function renderCands(list){document.getElementById('candContainer').innerHTML=list.map(c=>`<div class="cand"><span class="name">${c.name}</span><br><span class="glyph">0x${c.glyph}</span> · resonance ${c.resonance}</div>`).join('')||'<div style="color:#665544">none yet</div>';}
function renderTally(t){document.getElementById('tallyContainer').innerHTML=Object.entries(t||{}).map(([n,v])=>`<div class="stat"><span>${n}</span><span class="val">${v}</span></div>`).join('')||'<div style="color:#665544">no votes yet</div>';}
async function load(){try{const s=await fetchJson('/api/naming-ceremony?action=status');if(s.sealed){document.getElementById('vaultName').textContent=s.name;document.getElementById('vaultGlyph').textContent=`0x${s.glyph}`;document.getElementById('ceremonyNo').textContent=`Ceremony #${s.ceremonies}`;}else{document.getElementById('vaultName').textContent='— unsealed —';document.getElementById('vaultGlyph').textContent='';document.getElementById('ceremonyNo').textContent='';}}catch(e){}}
async function propose(){const r=await fetchJson('/api/naming-ceremony?action=propose&count=6');renderCands(r.candidates);}
async function vote(){const r=await fetchJson('/api/naming-ceremony?action=vote');if(r.winner){renderTally(r.votes);document.getElementById('vaultName').textContent=`🏆 ${r.winner}`;document.getElementById('vaultGlyph').textContent=`0x${r.glyph}`;}else{renderTally({});}}
async function seal(){const r=await fetchJson('/api/naming-ceremony?action=seal');if(r.sealed){document.getElementById('vaultName').textContent=r.name;document.getElementById('vaultGlyph').textContent=`0x${r.glyph}`;document.getElementById('ceremonyNo').textContent=`Ceremony #${r.ceremony_number}`;}}
load();</script></body></html>
