<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resonance Topology · IXpansion</title>
<style>
  :root {
    --bg: #0b0b12;
    --fg: #c8c8d8;
    --accent: #4cff7a;
    --accent2: #8fd3ff;
    --muted: #555570;
    --surface: #161622;
    --border: #2a2a3a;
    --node: #4cff7a;
    --edge: #8fd3ff;
    --anomaly: #ff9a5c;
    --heartbeat: #ff3a00;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Courier New', monospace;
    background: var(--bg);
    color: var(--fg);
    padding: 24px;
    min-height: 100vh;
  }
  .identity { text-align: center; margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  .identity h1 { color: var(--accent2); font-size: 1.6em; letter-spacing: 0.1em; }
  .identity .subtitle { color: var(--muted); font-size: 0.85em; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; margin-bottom: 32px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .card h2 { color: var(--accent2); font-size: 1.05em; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .node { position: relative; width: 40px; height: 40px; border-radius: 50%; background: var(--node); color: var(--bg); font-size: 0.7em; display: flex; align-items: center; justify-content: center; margin: 2px; }
  .edge { stroke: var(--edge); stroke-width: 2; fill: none; }
  .anomaly { color: var(--anomaly); font-weight: bold; }
  .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .stat-label { color: var(--muted); }
  .stat-value { color: var(--accent); font-weight: bold; }
  .topology-canvas { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; height: 400px; width: 100%; position: relative; }
  .controls { margin: 16px 0; }
  .control-btn { background: var(--accent); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: 'Courier New', monospace; }
  .control-btn:hover { opacity: 0.85; }
  .badge { background: var(--surface); padding: 2px 8px; border-radius: 4px; font-size: 0.8em; color: var(--accent2); }

.back-btn{position:fixed;bottom:16px;left:16px;z-index:100;background:rgba(5,5,15,0.9);border:1px solid rgba(124,124,248,0.3);color:#7c7cf8;padding:8px 14px;border-radius:6px;font-family:inherit;font-size:0.7em;cursor:pointer;text-decoration:none;transition:all 0.2s;backdrop-filter:blur(4px)}
.back-btn:hover{background:rgba(124,124,248,0.15);color:#fff;border-color:rgba(124,124,248,0.6)}
</style>
<script src="/shared.js"></script>
</head>
<body>
<div class="identity">
  <h1>🌐 RESONANCE TOPOLOGY</h1>
  <div class="subtitle" id="wave-info">Loading...</div>
</div>

<div class="controls">
  <button class="control-btn" onclick="simulate(3)">3-step Simulate</button>
  <button class="control-btn" onclick="simulate(5)">5-step Simulate</button>
  <button class="control-btn" onclick="simulate(10)">10-step Simulate</button>
  <span style="margin-left:16px; color:var(--muted)">strength: 0.15</span>
</div>

<div class="grid">
  <div class="card" style="grid-column: 1 / -1;">
    <h2>Topology Visualization</h2>
    <canvas id="topologyCanvas" class="topology-canvas"></canvas>
    <div id="nodeInfo" style="margin-top:12px; color:var(--muted); font-size:0.85em;"></div>
  </div>

  <div class="card">
    <h2>Resonance Matrix Stats</h2>
    <div class="stat-row"><span class="stat-label">Total Modules</span><span class="stat-value" id="totalModules">-</span></div>
    <div class="stat-row"><span class="stat-label">Total Edges</span><span class="stat-value" id="totalEdges">-</span></div>
    <div class="stat-row"><span class="stat-label">Avg Resonance</span><span class="stat-value" id="avgResonance">-</span></div>
    <div class="stat-row"><span class="stat-label">Stable Modules</span><span class="stat-value" id="stableModules">-</span></div>
  </div>

  <div class="card">
    <h2>Recent Anomalies</h2>
    <div id="anomaliesVis"></div>
  </div>

  <div class="card" style="grid-column: 1 / -1;">
    <h2>Topology Vitals</h2>
    <div class="stat-row"><span class="stat-label">Organism Modules</span><span class="stat-value" id="organismModules">-</span></div>
    <div class="stat-row"><span class="stat-label">Topology History</span><span class="stat-value" id="topologyHistory">-</span></div>
    <div class="stat-row"><span class="stat-label">Recent Anomalies</span><span class="stat-value" id="recentAnomalies">-</span></div>
  </div>
</div>

<script>
(function() {
  var el = window.IXP;
  if (el && el.renderIdentity) el.renderIdentity(document.getElementById('wave-info'));
})();

async function fetchTopology() {
  try {
    const r = await fetch('/resonance-topology');
    const d = await r.json();

    var vis = d.visualization || d;
    var canvas = document.getElementById('topologyCanvas');
    var ctx = canvas.getContext('2d');
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    ctx.fillStyle = var(--bg);
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    var nodes = vis.nodes || [];
    var edges = vis.edges || [];

    // Draw edges
    ctx.strokeStyle = var(--edge);
    ctx.lineWidth = 2;
    edges.forEach(function(e) {
      var n1 = nodes.find(function(n) { return n.module === e.source; });
      var n2 = nodes.find(function(n) { return n.module === e.target; });
      if (n1 && n2) {
        var x1 = canvas.width/2 + n1.x * 80;
        var y1 = canvas.height/2 - n1.y * 80;
        var x2 = canvas.width/2 + n2.x * 80;
        var y2 = canvas.height/2 - n2.y * 80;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    });

    // Draw nodes
    nodes.forEach(function(n) {
      var x = canvas.width/2 + n.x * 80;
      var y = canvas.height/2 - n.y * 80;
      ctx.beginPath();
      ctx.arc(x, y, n.radius, 0, Math.PI * 2);
      ctx.fillStyle = var(--node);
      ctx.fill();
      ctx.strokeStyle = var(--bg);
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = var(--bg);
      ctx.fillText(n.module.substring(0, 10), x - 20, y + 5);
    });

    // Draw anomalies
    var anomalies = d.anomalies || [];
    ctx.fillStyle = var(--anomaly);
    anomalies.forEach(function(a) {
      var m = nodes.find(function(n) { return n.module === a.module; });
      if (m) {
        var x = canvas.width/2 + m.x * 80;
        var y = canvas.height/2 - m.y * 80;
        ctx.beginPath();
        ctx.arc(x, y, m.radius, 0, Math.PI * 2);
        ctx.fillStyle = var(--anomaly);
        ctx.fill();
      }
    });

    // UI updates
    document.getElementById('totalModules').textContent = vis.total_modules || '-';
    document.getElementById('totalEdges').textContent = vis.total_edges || '-';
    document.getElementById('avgResonance').textContent = vis.average_resonance ? vis.average_resonance.toFixed(3) : '-';
    document.getElementById('stableModules').textContent = (function() {
      var s = vis.stability || {};
      return Object.values(s).filter(function(v) { return v > 0.7; }).length + '/' + Object.keys(s).length;
    })() || '-';
    document.getElementById('organismModules').textContent = vis.vitals ? v.organism_modules : '-';
    document.getElementById('topologyHistory').textContent = d.vitals ? v.topology_history : '-';
    document.getElementById('recentAnomalies').textContent = v ? v.recent_anomalies.length : '-';

    var aEl = document.getElementById('anomaliesVis');
    aEl.innerHTML = '';
    anomalies.forEach(function(a) {
      var div = document.createElement('div');
      div.className = 'anomaly-item';
      div.innerHTML = '<span class="anomaly-type">' + (a.glyph || '?') + ' ' + a.type + '</span> - ' + a.module + ' (severity: ' + a.severity.toFixed(2) + ')';
      aEl.appendChild(div);
    });

    // Node info on hover
    var nodeInfo = document.getElementById('nodeInfo');
    nodeInfo.innerHTML = '';
    nodes.slice(0, 6).forEach(function(n) {
      var div = document.createElement('div');
      div.innerHTML = n.module + ' [cluster: ' + n.cluster + ', stability: ' + n.stability.toFixed(2) + ']';
      nodeInfo.appendChild(div);
    });
  } catch(e) {
    document.getElementById('topologyCanvas').textContent = 'Error: ' + e.message;
  }
}

function simulate(iterations) {
  fetch('/resonance-topology?action=simulate&iterations=' + iterations)
    .then(r => r.json())
    .then(d => fetchTopology())
    .catch(e => console.error(e));
}

fetchTopology();
setInterval(fetchTopology, 20000);
</script>
<a class="back-btn" href="index.html">← Organism</a>

  }
  fetchAll(); setInterval(fetchAll, 15000);
})();
</script>

</body>
</html>
