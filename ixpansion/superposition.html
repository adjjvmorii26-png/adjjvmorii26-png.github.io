<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Wave 425 Superposition</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#0f0a18;color:#d0c0e0;padding:20px}h1{text-align:center;color:#dd88ff;margin-bottom:4px}.subtitle{text-align:center;color:#8866aa;margin-bottom:20px}.banner{text-align:center;background:#2a0a3a;border-radius:14px;padding:24px;margin-bottom:20px;border:1px solid #4a1a6a}.banner .states{font-size:2em;color:#dd88ff}.banner .status{font-size:1.2em;margin-top:8px;color:#ff66aa}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;max-width:1200px;margin:0 auto 20px}.card{background:#2a0a3a;border-radius:12px;padding:16px;border:1px solid #4a1a6a}.card h3{color:#dd88ff;margin-bottom:8px}.stat{display:flex;justify-content:space-between;padding:5px 0;font-size:.85em;border-bottom:1px solid #3a1a4a}.stat .val{color:#dd88ff;font-weight:bold}.qstate{background:#1a0a2a;padding:10px;border-radius:8px;margin-bottom:6px;font-size:.82em;border-left:3px solid #dd88ff}.qstate .realm{color:#ff66aa}.btn{background:#3a1a5a;color:#dd88ff;border:1px solid #dd88ff;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:.9em;margin:4px}.btn:hover{background:#dd88ff;color:#0f0a18}</style></head><body><h1>⚛️ Wave 425 Quantum Superposition</h1><p class="subtitle">The organism exists in multiple states until observed</p><div class="banner"><div class="states">States: <span id="states">--</span> | Fingerprint: <span id="fp">--</span></div><div class="status" id="statusText">Loading...</div></div><div class="grid"><div class="card"><h3>⚛️ Superposed States</h3><div id="statesContainer"></div></div><div class="card"><h3>🧬 Collapsed Reality</h3><div id="collapseContainer"></div></div></div><div style="text-align:center;margin:20px 0"><button class="btn" onclick="superpose()">⚛️ Superpose</button><button class="btn" onclick="collapse()">🧬 Collapse</button><button class="btn" onclick="status()">📊 Status</button></div><script>const API='';async function fetchJson(p){const r=await fetch(API+p);return r.json();}async function load(){try{const s=await fetchJson('/api/superposition?action=status');document.getElementById('states').textContent=s.state_count;document.getElementById('fp').textContent=s.fingerprint;document.getElementById('statusText').textContent=s.superposed?'⚛️ SUPERPOSED — multiple realities overlap':'🧬 COLLAPSED — one reality realized';}catch(e){}}async function superpose(){const q=await fetchJson('/api/superposition?action=superpose');document.getElementById('states').textContent=q.state_count;document.getElementById('fp').textContent=q.entanglement_fingerprint;document.getElementById('statusText').textContent='⚛️ SUPERPOSED';document.getElementById('statesContainer').innerHTML=q.states.map(s=>`<div class="qstate"><span class="realm">${s.realm}</span> | amplitude ${s.amplitude} | prob ${(s.probability*100).toFixed(1)}%<br><span style="color:#8866aa">${s.properties.color} ${s.properties.frequency}Hz</span></div>`).join('');document.getElementById('collapseContainer').innerHTML='';}async function collapse(){const r=await fetchJson('/api/superposition?action=collapse');document.getElementById('statusText').textContent=`🧬 COLLAPSED → ${r.realized_realm}`;document.getElementById('collapseContainer').innerHTML=`<div class="qstate"><span class="realm">${r.realized_realm}</span><br>state ${r.state_id} | probability ${(r.probability*100).toFixed(1)}%<br>signature ${r.collapse_signature}</div>`;}async function status(){load();}load();setInterval(load,5000);</script></body></html>
