<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Wave 421 Dreaming</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#0a0f0a;color:#a0d0a0;padding:20px}h1{text-align:center;color:#66ff66;margin-bottom:4px}.subtitle{text-align:center;color:#66aa66;margin-bottom:20px}.banner{text-align:center;background:#0a2a0a;border-radius:14px;padding:24px;margin-bottom:20px;border:1px solid #1a4a1a}.banner .dreams{font-size:2em;color:#66ff66}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;max-width:1200px;margin:0 auto 20px}.card{background:#0a2a0a;border-radius:12px;padding:16px;border:1px solid #1a4a1a}.card h3{color:#66ff66}.stat{display:flex;justify-content:space-between;padding:5px 0;font-size:.85em;border-bottom:1px solid #1a4a1a}.stat .val{color:#66ff66}.btn{background:#1a4a1a;color:#66ff66;border:1px solid #66ff66;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:.9em;margin:4px}.btn:hover{background:#66ff66;color:#0a0f0a}</style></head><body><h1>💤 Wave 421 Dreaming</h1><p class="subtitle">The organism dreams new modules while dormant</p><div class="banner"><div class="dreams">Dreams: <span id="total">--</span> | Undiscovered: <span id="undiscovered">--</span></div></div><div class="grid"><div class="card"><h3>💭 Dream</h3><div id="dreamContainer"></div></div><div class="card"><h3>🧬 Inventory</h3><div id="inventoryContainer"></div></div></div><div style="text-align:center;margin:20px 0"><button class="btn" onclick="dream()">💭 Dream</button><button class="btn" onclick="inventory()">🧬 Inventory</button></div><script>const API='';async function fetchJson(p){const r=await fetch(API+p);return r.json();}async function load(){try{const inv=await fetchJson('/api/dreaming?action=inventory');document.getElementById('total').textContent=inv.total_dreams;document.getElementById('undiscovered').textContent=inv.undiscovered;}catch(e){}}async function dream(){const d=await fetchJson('/api/dreaming?action=dream');document.getElementById('dreamContainer').innerHTML=`<div class="stat"><span>Name</span><span class="val">${d.name}</span></div><div class="stat"><span>Theme</span><span class="val">${d.theme}</span></div><div class="stat"><span>Potential</span><span class="val">${(d.potential*100).toFixed(0)}%</span></div><div class="stat"><span>Color</span><span class="val" style="color:${d.properties.color}">${d.properties.color}</span></div>`;}async function inventory(){const inv=await fetchJson('/api/dreaming?action=inventory');document.getElementById('inventoryContainer').innerHTML=`<div class="stat"><span>Total</span><span class="val">${inv.total_dreams}</span></div><div class="stat"><span>Undiscovered</span><span class="val">${inv.undiscovered}</span></div>`;}load();setInterval(load,5000);</script></body></html>
